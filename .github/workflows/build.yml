name: Build and Deploy

on:
  push:
    branches: [main, stage]

env:
  IMAGE: ghcr.io/sijba-it/sijba
  ANSIBLE_GIT_URL: ssh://git@REDACTED-GIT-HOST:7999/edvbartl/edvbartl-ansible.git

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run pyflakes + pytest (inside Dockerfile.test)
        run: docker build -f Dockerfile.test -t sijba-test:${{ github.run_id }} .

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: echo "tag=$(date +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          provenance: false
          build-args: |
            SIJBA_VERSION=${{ steps.vars.outputs.tag }}
            GIT_COMMIT=${{ github.sha }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
            ${{ env.IMAGE }}:latest

  update-deployment:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.build-and-push.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GITEA_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/known_hosts <<'EOF'
          [REDACTED-GIT-HOST]:7999 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID05D6TeVR67Q9M3aKd4ElUwg2O5F4Odw75GRe4rccx3
          EOF
      - name: Bump image tag in edvbartl-ansible
        run: |
          set -e
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o UserKnownHostsFile=~/.ssh/known_hosts"
          rm -rf edvbartl-ansible
          git clone --depth 1 --branch main "${ANSIBLE_GIT_URL}" edvbartl-ansible
          cd edvbartl-ansible
          DEPLOY="kustomize-k8s/bases/sijba/statefulset.yaml"
          test -f "$DEPLOY" || { echo "missing $DEPLOY"; exit 1; }
          sed -i "s|image: ghcr.io/sijba-it/sijba:.*|image: ${IMAGE}:${TAG}|" "$DEPLOY"
          sed -i "s|image: REDACTED-REGISTRY/sijba:.*|image: ${IMAGE}:${TAG}|" "$DEPLOY"
          git config user.email "github-actions@sijba-it"
          git config user.name "GitHub Actions"
          git add "$DEPLOY"
          if git diff --staged --quiet; then
            echo "No changes to statefulset.yaml (tag already set?)"
            exit 0
          fi
          git commit -m "sijba: image ${TAG}"
          git push origin HEAD:main
      - name: Trigger ArgoCD refresh
        env:
          ARGOCD_USER: ${{ secrets.ARGOCD_USER }}
          ARGOCD_PASS: ${{ secrets.ARGOCD_PASS }}
        run: bash scripts/argocd-refresh.sh sijba
